<!doctype html>
<html>
  <head>
    <style>
      @font-face {
        font-family: Satoshi;
        src: url('http://127.0.0.1:4323/fonts/Satoshi-Variable.woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #244cdb;
        color: #fff;
        font-family: Satoshi, Arial, sans-serif;
        padding: 64px;
      }
      h1 {
        font-size: 112px;
        line-height: 0.98;
        letter-spacing: -8px;
        font-weight: 550;
        margin: 0 0 40px;
      }
      p {
        font-size: 28px;
        line-height: 1.5;
        margin: 0;
        color: #e6ebff;
      }
      span {
        position: absolute;
        bottom: 60px;
        right: 64px;
        font-size: 20px;
      }
      .orbit {
        position: absolute;
        width: 440px;
        height: 440px;
        border: 1px solid #ffffff50;
        border-radius: 50%;
        right: 60px;
        top: 70px;
      }
      .mark {
        position: absolute;
        right: 110px;
        top: 170px;
        font-size: 180px;
        letter-spacing: -20px;
      }
    </style>
  </head>
  <body>
    <h1>Freddie<br />Philpot.</h1>
    <p>
      Development &amp; cybersecurity.<br />Building applications. Exploring
      systems.
    </p>
    <div class="orbit"></div>
    <div class="mark">fp.</div>
    <span>freddiephilpot.dev</span>
  </body>
</html>
